plugins { id "com.android.library" }

// Local AI's native engine ships as assets rather than jniLibs, so neither APK becomes arm64-only at
// install time. prepare_local_ai.py verifies the SHA-256 pinned llama.cpp b11364 downloads, builds the
// JNI wrapper with CMake and the NDK, and writes localai/ assets that LocalAiProvider extracts on use.
abstract class PrepareLocalAiNative extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getAssetDirectory()
}

def prepareLocalAiNative = tasks.register("prepareLocalAiNative", PrepareLocalAiNative) {
    assetDirectory.set(layout.buildDirectory.dir("generated/local-ai/assets"))
    inputs.dir("tools")
    inputs.dir("src/main/cpp/localai")
    executable "python3"
    args file("tools/prepare_local_ai.py"), assetDirectory.get().asFile,
            layout.buildDirectory.dir("intermediates/local-ai").get().asFile,
            rootProject.file(".gradle/ivlyrics-dependencies")
}

android {
    namespace "kr.ivlis.ivlyricsandroid"
    compileSdk { version = release(36) { it.minorApiLevel = 1 } }
    defaultConfig {
        minSdk 26
        testInstrumentationRunner "kr.ivlis.ivlyricsandroid.BackgroundArtworkInstrumentation"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(prepareLocalAiNative) { it.assetDirectory }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

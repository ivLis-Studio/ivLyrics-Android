<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var tokenizer = null;
      var initPromise = null;
      var conversionCache = new Map();
      var maxCacheSize = 1000;
      var libraryPaths = [
        "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js",
        "https://unpkg.com/kuromoji@0.1.2/build/kuromoji.js"
      ];
      var dictPaths = [
        "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict",
        "https://unpkg.com/kuromoji@0.1.2/dict"
      ];

      // Kuromoji 0.1.2 joins dictionary URLs with Node's path.join, which turns
      // https:// into https:/. With an HTTPS document base that becomes a path
      // on our own host. Repair only the two known dictionary prefixes in this
      // isolated WebView before the browser resolves the request URL.
      var xhrOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function () {
        var args = Array.prototype.slice.call(arguments);
        if (typeof args[1] === "string") {
          for (var i = 0; i < dictPaths.length; i++) {
            var brokenPrefix = dictPaths[i].replace("https://", "https:/") + "/";
            if (args[1].indexOf(brokenPrefix) === 0) {
              args[1] = dictPaths[i] + "/" + args[1].substring(brokenPrefix.length);
              break;
            }
          }
        }
        return xhrOpen.apply(this, args);
      };

      function log(message) {
        if (window.AndroidFurigana && window.AndroidFurigana.onLog) {
          window.AndroidFurigana.onLog(String(message || ""));
        }
      }

      function reply(requestId, payload) {
        if (window.AndroidFurigana && window.AndroidFurigana.onResult) {
          window.AndroidFurigana.onResult(String(requestId || ""), JSON.stringify(payload || {}));
        }
      }

      function loadLibrary(url) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          var settled = false;
          var timer = setTimeout(function () {
            finish(new Error("Kuromoji library load timed out"));
          }, 6000);
          function finish(error) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            script.onload = script.onerror = null;
            script.remove();
            if (error) reject(error);
            else resolve();
          }
          script.onload = function () {
            finish(window.kuromoji && typeof window.kuromoji.builder === "function"
              ? null : new Error("Kuromoji library not loaded"));
          };
          script.onerror = function () { finish(new Error("Kuromoji library load failed")); };
          script.src = url;
          document.head.appendChild(script);
        });
      }

      async function ensureLibrary() {
        if (window.kuromoji && typeof window.kuromoji.builder === "function") return;
        var lastError = null;
        for (var i = 0; i < libraryPaths.length; i++) {
          try {
            await loadLibrary(libraryPaths[i]);
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("Kuromoji library not loaded");
      }

      function buildTokenizer(dictPath) {
        return new Promise(function (resolve, reject) {
          if (!window.kuromoji) {
            reject(new Error("Kuromoji library not loaded"));
            return;
          }
          var timer = setTimeout(function () {
            reject(new Error("Kuromoji dictionary load timed out"));
          }, 12000);
          function finish(error, builtTokenizer) {
            clearTimeout(timer);
            if (error) {
              reject(error);
              return;
            }
            resolve(builtTokenizer);
          }
          try {
            window.kuromoji.builder({ dicPath: dictPath }).build(finish);
          } catch (error) {
            finish(error);
          }
        });
      }

      function init() {
        if (tokenizer) {
          return Promise.resolve(tokenizer);
        }
        if (initPromise) {
          return initPromise;
        }
        initPromise = (async function () {
          await ensureLibrary();
          var lastError = null;
          for (var i = 0; i < dictPaths.length; i++) {
            try {
              tokenizer = await buildTokenizer(dictPaths[i]);
              log("furigana js: kuromoji ready / dict=" + dictPaths[i]);
              if (window.AndroidFurigana && window.AndroidFurigana.onReady) {
                window.AndroidFurigana.onReady();
              }
              return tokenizer;
            } catch (error) {
              lastError = error;
            }
          }
          throw lastError || new Error("Kuromoji dictionary load failed");
        })().catch(function (error) {
          // A failed CDN/dictionary attempt must not poison every later request.
          initPromise = null;
          throw error;
        });
        return initPromise;
      }

      function containsKanji(text) {
        return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(text || ""));
      }

      function katakanaToHiragana(value) {
        return String(value || "").split("").map(function (char) {
          var code = char.charCodeAt(0);
          if (code >= 0x30a1 && code <= 0x30f6) {
            return String.fromCharCode(code - 0x60);
          }
          return char;
        }).join("");
      }

      function convertToFurigana(text) {
        text = typeof text === "string" ? text : String(text || "");
        if (!text || !containsKanji(text)) {
          return text;
        }
        if (conversionCache.has(text)) {
          return conversionCache.get(text);
        }
        if (!tokenizer) {
          return text;
        }

        try {
          var tokens = tokenizer.tokenize(text);
          var result = "";
          for (var tokenIndex = 0; tokenIndex < tokens.length; tokenIndex++) {
            var token = tokens[tokenIndex];
            var surface = token.surface_form || "";
            var reading = token.reading || token.pronunciation || "";
            if (reading && containsKanji(surface)) {
              var hiragana = katakanaToHiragana(reading);
              var tokenResult = "";
              var readingIndex = 0;
              var i = 0;
              while (i < surface.length) {
                var char = surface[i];
                if (containsKanji(char)) {
                  var kanjiSequence = char;
                  i++;
                  while (i < surface.length && containsKanji(surface[i])) {
                    kanjiSequence += surface[i];
                    i++;
                  }

                  var nextKana = "";
                  var tempI = i;
                  while (tempI < surface.length && !containsKanji(surface[tempI])) {
                    nextKana += surface[tempI];
                    tempI++;
                  }

                  var kanjiReading = "";
                  if (nextKana.length > 0) {
                    var remainingReading = hiragana.substring(readingIndex);
                    var kanaIndex = remainingReading.indexOf(nextKana);
                    if (kanaIndex > 0) {
                      kanjiReading = remainingReading.substring(0, kanaIndex);
                    } else if (kanaIndex < 0) {
                      kanjiReading = remainingReading;
                    }
                  } else {
                    kanjiReading = hiragana.substring(readingIndex);
                  }

                  if (kanjiReading) {
                    tokenResult += "<ruby>" + kanjiSequence + "<rt>" + kanjiReading + "</rt></ruby>";
                    readingIndex += kanjiReading.length;
                  } else {
                    tokenResult += kanjiSequence;
                  }
                } else {
                  tokenResult += char;
                  readingIndex++;
                  i++;
                }
              }
              result += tokenResult;
            } else {
              result += surface;
            }
          }

          if (conversionCache.size >= maxCacheSize) {
            conversionCache.delete(conversionCache.keys().next().value);
          }
          conversionCache.set(text, result);
          return result;
        } catch (error) {
          return text;
        }
      }

      window.ivLyricsFurigana = {
        request: async function (requestId, rawPayload) {
          try {
            var payload = typeof rawPayload === "string" ? JSON.parse(rawPayload) : (rawPayload || {});
            var lines = Array.isArray(payload.lines) ? payload.lines : [];
            await init();
            reply(requestId, {
              ok: true,
              lines: lines.map(function (line) {
                return convertToFurigana(line);
              })
            });
          } catch (error) {
            reply(requestId, {
              ok: false,
              error: String(error && error.message ? error.message : error)
            });
          }
        }
      };

      init().catch(function (error) {
        log("furigana js init failed: " + String(error && error.message ? error.message : error));
        if (window.AndroidFurigana && window.AndroidFurigana.onInitializationError) {
          window.AndroidFurigana.onInitializationError(String(error && error.message ? error.message : error));
        }
      });
    })();
  </script>
</head>
<body></body>
</html>

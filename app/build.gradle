plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/release-signing.gradle")

android {
    namespace "kr.ivlis.ivlyricsandroid.app"
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "kr.ivlis.ivlyricsandroid"
        minSdk 26
        // Google Play requires API 36 for new apps and updates from August 31, 2026.
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode providers.gradleProperty("ivLyricsVersionCode").get().toInteger()
        versionName providers.gradleProperty("ivLyricsVersionName").get()
    }

    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            matchingFallbacks = ["debug"]
        }
        release {
            if (ivLyricsReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        // Google Play build: the release build plus src/play/AndroidManifest.xml, which leaves out the
        // GitHub APK updater, the Discord account and the Spotify shortcut (see DistributionChannel).
        // Built as an app bundle with :app:bundlePlay; the GitHub release keeps building :app:assembleRelease.
        play {
            initWith release
            matchingFallbacks = ["release"]
        }
    }

    sourceSets {
        qa {
            java.srcDir "src/debug/java"
            manifest.srcFile "src/debug/AndroidManifest.xml"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":shared")
    implementation "androidx.webkit:webkit:1.9.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "junit:junit:4.13.2"
}

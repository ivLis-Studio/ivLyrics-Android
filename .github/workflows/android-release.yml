name: Android Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
      prerelease:
        description: "Mark release as prerelease"
        required: true
        type: boolean
        default: false
      notify_discord:
        description: "Send release notes to Discord"
        required: true
        type: boolean
        default: false
      publish:
        description: "Publish the built APKs to GitHub Releases"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-release:
    name: Build and publish APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" "build-tools;36.0.0"

      - name: Run Android lint and release packaging tests
        run: |
          ./gradlew :shared:testDebugUnitTest :shared:lintDebug :app:lintDebug :spotify-module:lintDebug
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 tests/run_release_asset_regression.py
          python3 tests/run_module_metadata_fanout_regression.py
          python3 tests/run_module_hook_cache_regression.py
          python3 tests/run_lyrics_interval_regression.py
          python3 tests/run_provider_overlap_regression.py
          python3 tests/run_renderer_overlap_regression.py
          python3 tests/run_lyrics_metadata_cache_regression.py
          python3 tests/run_karaoke_motion_regression.py
          python3 tests/run_card_presence_regression.py
          python3 tests/run_karaoke_controller_regression.py
          python3 tests/run_inline_gate_regression.py
          python3 tests/run_inline_hooks_regression.py
          python3 tests/run_inline_lifecycle_regression.py
          python3 tests/run_supplement_loading_regression.py
          python3 tests/run_repository_completion_regression.py
          python3 tests/run_furigana_loading_regression.py
          python3 tests/run_furigana_webview_regression.py
          node --test tests/furigana_bridge.test.mjs
          python3 tests/run_metadata_refresh_loading_regression.py

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" != "0" ]]; then
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/ivlyrics-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          {
            echo "IVLYRICS_RELEASE_STORE_FILE=${keystore_path}"
            echo "IVLYRICS_RELEASE_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "IVLYRICS_RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "IVLYRICS_RELEASE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build both signed release APKs
        run: ./gradlew :app:assembleRelease :spotify-module:assembleRelease -PivLyricsRequireReleaseSigning=true

      - name: Verify module boundaries
        run: python3 tests/check_module_boundaries.py --built --variant release

      - name: Verify and collect both release APKs
        id: collect
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_RELEASE_TAG}"
          fi
          python3 .github/scripts/collect_release_apks.py --tag "${release_tag}" --output release-apks
          release_target="$(git rev-parse --verify "${release_tag}^{commit}" 2>/dev/null || git rev-parse HEAD)"
          {
            echo "release_tag=${release_tag}"
            echo "release_target=${release_target}"
            echo "apk_list<<EOF"
            find release-apks -type f -name "*.apk" -print | sort
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate release notes and version file
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          RELEASE_TAG: ${{ steps.collect.outputs.release_tag }}
          APK_DIR: release-apks
          RELEASE_METADATA_DIR: release-metadata
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_SECONDS: "300"
        run: python3 .github/scripts/generate_release_metadata.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivLyrics-Android-${{ steps.collect.outputs.release_tag }}-apks
          path: |
            release-apks/*.apk
            release-apks/packaging-report.json
            release-metadata/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.collect.outputs.release_tag }}
          RELEASE_TARGET: ${{ steps.collect.outputs.release_target }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                if [[ "${asset}" == *"-debug.apk" ]]; then
                  gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
                fi
              done
            gh release edit "${RELEASE_TAG}" \
              --target "${RELEASE_TARGET}" \
              --title "ivLyrics Android ${RELEASE_TAG}" \
              --notes-file release-metadata/release-notes.md \
              "${args[@]}"
            gh release upload "${RELEASE_TAG}" release-apks/*.apk release-metadata/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-apks/*.apk release-metadata/* \
              --target "${RELEASE_TARGET}" \
              --title "ivLyrics Android ${RELEASE_TAG}" \
              --notes-file release-metadata/release-notes.md \
              "${args[@]}"
          fi

      - name: Send Android release notes to Discord
        if: github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.notify_discord)
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_NOTES_WEBHOOK_URL }}
          RELEASE_PLATFORM: android
          RELEASE_TAG: ${{ steps.collect.outputs.release_tag }}
          RELEASE_TITLE: ivLyrics Android ${{ steps.collect.outputs.release_tag }}
          RELEASE_NOTES_PATH: release-metadata/release-notes.md
        run: node .github/scripts/send_release_webhook.mjs

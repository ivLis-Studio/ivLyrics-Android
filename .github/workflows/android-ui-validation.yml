name: Android UI Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/Settings*.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/LocalAiSettingsView.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/BaseLyricsActivity.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/*I18n.java'
      - 'shared/src/test/java/kr/ivlis/ivlyricsandroid/AppI18nInitializationTest.java'
      - 'tests/run_first_use_regression.py'
      - 'tests/run_settings_ui_regression.py'
      - '.github/scripts/*settings_ui*'
      - 'app/src/debug/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - '.github/workflows/android-ui-validation.yml'
  pull_request:
    paths:
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/Settings*.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/LocalAiSettingsView.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/BaseLyricsActivity.java'
      - 'shared/src/main/java/kr/ivlis/ivlyricsandroid/*I18n.java'
      - 'shared/src/test/java/kr/ivlis/ivlyricsandroid/AppI18nInitializationTest.java'
      - 'tests/run_first_use_regression.py'
      - 'tests/run_settings_ui_regression.py'
      - '.github/scripts/*settings_ui*'
      - 'app/src/debug/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - '.github/workflows/android-ui-validation.yml'

permissions:
  contents: read

concurrency:
  group: android-ui-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  settings-ui:
    name: Native settings, first use and track popup UI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install build SDK and native tools
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build native UI test application
        run: |
          python3 tests/run_settings_ui_regression.py
          python3 tests/run_first_use_regression.py
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check native layouts and capture screenshots
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: ivlyrics-ui
          pre-emulator-launch-script: bash .github/scripts/prepare_settings_ui_avd.sh
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          enable-hw-keyboard: false
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run_settings_ui_validation.sh

      - name: Save native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-settings-ui
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/settings-ui/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
